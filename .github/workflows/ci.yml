name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: awesomejm
          POSTGRES_PASSWORD: awesomejm_dev
          POSTGRES_DB: awesomejm
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U awesomejm -d awesomejm" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm smoke
      - run: pnpm test:integration
        env:
          PG_TOOLS: docker
          PG_CONTAINER: ${{ job.services.postgres.id }}
